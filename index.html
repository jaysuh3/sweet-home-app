<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리집 알림장</title>
<meta name="theme-color" content="#E6F6F0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리집 알림장">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nunito:wght@600;700&display=swap">
<style>
/* Layout: 알림장 노트 — 연한 민트 바탕, 둥근 글꼴. 상단 오늘 요약, 탭으로 시간표·학원비·준비물·설정 전환. 모바일 우선 한 열, 넓으면 두 열. */
:root{
  --bg:#E6F6F0; --surface:#FFFFFF; --ink:#1B2A25; --muted:#587069; --line:#CBE5DC;
  --accent:#1F6B5C; --accent-ink:#FFFFFF; --accent-soft:#E2EFEB;
  --hl:#FFF1A8; --hl-ink:#3D3300;
  --bad:#C2362B; --bad-soft:#FBE6E3; --warn:#9A6410; --warn-soft:#FBF0D9; --ok:#1F6B5C; --ok-soft:#E2EFEB;
  --k1:#3566D0; --k2:#D0542C; --k3:#8448C2; --k4:#178A7B; --k5:#C0366F;
  --f-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"Nunito","Gowun Dodum",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1D19; --surface:#172823; --ink:#E3F1EC; --muted:#93AEA5; --line:#27403A;
  --accent:#5FC0A6; --accent-ink:#0C1A16; --accent-soft:#1C3530;
  --hl:#4A4214; --hl-ink:#FFF3B8;
  --bad:#FF8A7E; --bad-soft:#3A1F1C; --warn:#F2B65A; --warn-soft:#3A2E17; --ok:#5FC0A6; --ok-soft:#1C3530;
  --k1:#7EA2F0; --k2:#F08A62; --k3:#B78AEB; --k4:#4FC7B6; --k5:#EE7BA8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1D19; --surface:#172823; --ink:#E3F1EC; --muted:#93AEA5; --line:#27403A;
  --accent:#5FC0A6; --accent-ink:#0C1A16; --accent-soft:#1C3530;
  --hl:#4A4214; --hl-ink:#FFF3B8;
  --bad:#FF8A7E; --bad-soft:#3A1F1C; --warn:#F2B65A; --warn-soft:#3A2E17; --ok:#5FC0A6; --ok-soft:#1C3530;
  --k1:#7EA2F0; --k2:#F08A62; --k3:#B78AEB; --k4:#4FC7B6; --k5:#EE7BA8;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 24px;max-width:380px;width:100%;text-align:center;display:grid;gap:14px}
.gate-card img{width:84px;height:84px;border-radius:20px;margin:0 auto}
.gate-err{color:var(--bad);font-size:.9rem}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:1rem;font-weight:600;cursor:pointer;color:var(--ink)}
.gbtn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:1.9rem;line-height:1.2}
h2{font-size:1.25rem}
h3{font-size:1.1rem}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.today-label{font-size:.8rem;letter-spacing:.08em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.85rem;white-space:nowrap}
.chip b{font-family:var(--f-num);font-weight:500}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}

.top{position:relative;padding-right:52px}
.tabdot{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--bad);color:#fff;font-family:var(--f-num);font-size:.7rem;vertical-align:1px}
.nlist{display:flex;flex-direction:column;gap:10px}
.ncard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:6px;min-width:0}
.ncard.pinned{background:var(--hl);color:var(--hl-ink);border-color:transparent}
.ncard.pinned .muted{color:inherit;opacity:.75}
.ncard header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px}
.ncard.past{opacity:.7}
.ncard .ntext{white-space:pre-wrap;overflow-wrap:anywhere;font-size:1rem}
.ncard footer{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px}
.gear{position:absolute;top:0;right:0;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center}
.gear:hover{color:var(--accent);border-color:var(--accent)}
.gear[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:16px;padding-block:8px;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:8px;white-space:nowrap;color:var(--muted);font-weight:500}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

main{margin-top:20px}
.grid2{display:grid;grid-template-columns:1fr;gap:20px}
@media (min-width:820px){.grid2{grid-template-columns:1.1fr .9fr}}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.hl-panel{background:var(--hl);color:var(--hl-ink);border-color:transparent}
.hl-panel .muted{color:inherit;opacity:.75}

.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block;background:var(--kc,var(--muted))}
.kidtag{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:500;color:var(--kc,var(--muted))}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0;padding-top:0}
.row .main{flex:1;min-width:0}
.row .title{font-weight:500;overflow-wrap:anywhere}
.row .sub{font-size:.83rem;color:var(--muted);overflow-wrap:anywhere}
.time{font-family:var(--f-num);font-size:.85rem;min-width:92px;color:var(--muted)}
.when{font-family:var(--f-num);font-size:.8rem;min-width:54px;text-align:center;line-height:1.25}
.when b{display:block;font-size:1rem;font-weight:500;color:var(--ink)}
.bar{width:4px;align-self:stretch;border-radius:2px;background:var(--kc,var(--line));flex:none}

.pill{font-size:.75rem;padding:2px 8px;border-radius:999px;white-space:nowrap;font-weight:500}
.pill.paid{background:var(--ok-soft);color:var(--ok)}
.pill.overdue{background:var(--bad-soft);color:var(--bad)}
.pill.soon{background:var(--warn-soft);color:var(--warn)}
.pill.later{background:var(--bg);color:var(--muted)}
.pill.type{background:var(--bg);color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-size:.88rem;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.kidblock{display:flex;flex-direction:column;gap:2px}
.kidblock + .kidblock{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.kidname{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}

/* 주간 시간표 */
.week-scroll{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
.week{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:8px;min-width:860px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:160px;display:flex;flex-direction:column;gap:6px}
.day.is-today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.day h3{font-size:1rem;display:flex;justify-content:space-between}
.blk{border-left:4px solid var(--kc);background:var(--bg);border-radius:6px;padding:6px 8px;font-size:.85rem}
.blk .t{font-family:var(--f-num);font-size:.75rem;color:var(--muted)}
.blk.clash{outline:1.5px dashed var(--bad)}
.blk.dm{background:none;border-left-style:dotted}
.filter.seg{gap:0}
.filter.seg button{border-radius:0}
.filter.seg button:first-child{border-radius:999px 0 0 999px}
.filter.seg button:last-child{border-radius:0 999px 999px 0;border-left:0}
.vacband{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 14px;border-radius:var(--r);background:var(--accent-soft);margin-bottom:16px;font-size:.9rem}
.vacband b{font-family:var(--f-display);font-weight:400;font-size:1.05rem}
.blk.off{opacity:.45;text-decoration:line-through}
.filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filter button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem;display:inline-flex;align-items:center;gap:6px}
.filter button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* 요일별 시간표 그림 */
.gwrap{overflow-x:auto;padding-bottom:4px}
.ggrid{display:grid;gap:0 6px;min-width:600px}
.gday{display:flex;flex-direction:column;min-width:0}
.ghead{font-family:var(--f-display);text-align:center;padding-block:4px 8px;font-size:1.05rem}
.ghead.is-today{color:var(--accent)}
.ghead.is-today::after{content:" 오늘";font-size:.72rem;font-family:var(--f-body)}
.gcol{position:relative;background-color:var(--surface);border:1px solid var(--line);border-radius:8px;background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 64px)}
.gaxis .gcol{background:none;border-color:transparent}
.gaxis span{position:absolute;right:6px;transform:translateY(-50%);font-family:var(--f-num);font-size:.72rem;color:var(--muted)}
.gaxis span:first-child{transform:none}
.gblk{position:absolute;border-radius:6px;background:color-mix(in srgb,var(--kc) 16%,var(--surface));border-left:4px solid var(--kc);padding:3px 6px;font-size:.76rem;line-height:1.25;overflow:hidden;color:var(--ink)}
.gblk b{display:block;font-weight:600;overflow-wrap:anywhere}
[hidden]{display:none!important}
.gblk span{color:var(--muted);font-size:.7rem}
.gblk.clash{outline:1.5px dashed var(--bad);outline-offset:-1px}
.gblk .gwho,.gmark b,.gshut b{display:block;color:var(--accent);font-weight:600;font-size:.72rem}
.gmark b,.gshut b{display:inline}
.gshut{position:absolute;border-radius:4px;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--kc) 10%,transparent) 0 6px,transparent 6px 12px);border-left:2px dashed var(--kc);padding:1px 5px;font-size:.68rem;line-height:1.2;color:var(--muted);overflow:hidden}
.gmark{position:absolute;border-top:2px dotted var(--kc);padding:1px 4px;font-size:.7rem;line-height:1.2;color:var(--ink);overflow:hidden;background:color-mix(in srgb,var(--surface) 85%,transparent)}
.gcol .dim{opacity:.22}

/* 학원비 */
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sum div{min-width:0}
.sum .lab{font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.sum .val{font-family:var(--f-num);font-size:1.25rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.meter{height:8px;border-radius:4px;background:var(--bg);overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;background:var(--accent)}
.monthnav{display:flex;align-items:center;gap:6px}
.amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}

.who{font-weight:600;color:var(--accent)}
.who.none,.warn-text{color:var(--warn)}
.pill.fam{background:var(--k5);color:var(--surface)}
.pill.hw{background:var(--k3);color:var(--surface)}
.segopt{display:inline-flex}
.segopt input{position:absolute;opacity:0;width:1px;height:1px}
.segopt span{border:1px solid var(--line);background:var(--surface);padding:6px 14px;font-size:.9rem;color:var(--ink);cursor:pointer}
.segopt:first-child span{border-radius:999px 0 0 999px}
.segopt:last-child span{border-radius:0 999px 999px 0;border-left:0}
.segopt input:checked + span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.segopt input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.hwline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:4px;font-size:.83rem}
.hwitem{display:inline-flex;align-items:center;gap:5px}
.hwitem input{width:16px;height:16px}
.whoedit{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:4px;font-size:.83rem;color:var(--muted)}
.whoedit select{font-size:.85rem;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--accent);font-weight:600}
.whoedit select.unset{color:var(--warn);border-color:var(--warn)}
.route .r-ride .time,.route .r-back .time,.route .r-dismiss .time{color:var(--ink)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.done .title{text-decoration:line-through;color:var(--muted)}

.empty{padding:18px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center;font-size:.9rem}

/* 모달 */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:640px){.scrim{align-items:center}}
.sheet{background:var(--surface);border-radius:14px;width:100%;max-width:560px;max-height:calc(100% - 16px);overflow:auto;padding:18px}
.sheet header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.form input:not([type=checkbox]),.form select,.form textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:.95rem}
.form textarea{min-height:140px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.four{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.dayrow{display:grid;grid-template-columns:28px repeat(auto-fit,minmax(104px,1fr));gap:8px;align-items:end}
.dlab{font-family:var(--f-display);font-size:1.05rem;padding-bottom:8px}
.fs{border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;display:grid;gap:10px;margin:0;min-width:0}
.fs legend{font-size:.85rem;color:var(--ink);font-weight:600;padding:0 4px}
.form label.check{display:flex;flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{display:inline-flex;flex-direction:row;align-items:center;gap:4px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;color:var(--ink)}
.swatches{display:flex;gap:8px}
.swatches label{display:inline-flex}
.swatches input{position:absolute;opacity:0;width:1px;height:1px}
.swatches span{width:28px;height:28px;border-radius:50%;background:var(--kc);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches input:checked + span{box-shadow:0 0 0 2px var(--ink)}
.swatches input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
.ai-out{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.ai-out label{display:flex;flex-direction:row;align-items:flex-start;gap:10px;color:var(--ink);padding:8px;border:1px solid var(--line);border-radius:8px}
.notice{font-size:.85rem;padding:10px 12px;border-radius:8px;background:var(--accent-soft);color:var(--ink)}
@media (max-width:520px){h1{font-size:1.55rem}.sum .val{font-size:1.05rem}.time{min-width:78px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gate-card">
    <img src="icon-192.png" alt="">
    <h1>우리집 알림장</h1>
    <p class="muted small" id="gateMsg">로그인 상태를 확인하는 중이에요…</p>
    <button class="gbtn pri" id="gateIn" hidden>구글 계정으로 로그인</button>
    <button class="gbtn" id="gateOut" hidden>다른 계정으로 로그인 (로그아웃)</button>
  </div>
</div>
<div class="wrap" hidden>
  <div class="top">
    <div>
      <div class="today-label" id="todayLabel"></div>
      <h1>우리집 알림장</h1>
    </div>
    <div class="chips" id="chips"></div>
    <button class="gear" id="gear" data-tab="setup" aria-label="설정: 아이·학원 관리" title="설정 · 아이·학원 관리">

<script>
const KC = ['k1','k2','k3','k4','k5'];
const DOW = ['일','월','화','수','목','금','토'];
const WEEK_ORDER = [1,2,3,4,5,6,0];
const SCHOOL_TYPES = ['준비물','학교숙제','학원숙제','학교행사','시험','상담','제출','휴일','학원휴강'];
const FAM_TYPES = ['가족일정','병원','생일·기념일','나들이·체험','약속','기타'];
const EV_TYPES = [...SCHOOL_TYPES, ...FAM_TYPES];
const isFam = e => FAM_TYPES.includes(e.type);
const evSort = (a, b) => a.date.localeCompare(b.date) || (a.time||'99').localeCompare(b.time||'99');
const typeOptions = sel => `<optgroup label="학교·학원">${SCHOOL_TYPES.map(t=>`<option ${t===sel?'selected':''}>${t}</option>`).join('')}</optgroup><optgroup label="가족·생활">${FAM_TYPES.map(t=>`<option ${t===sel?'selected':''}>${t}</option>`).join('')}</optgroup>`;
const isHw = e => /숙제$/.test(e.type||'');
const CLASS_TYPES = ['학원숙제','학원휴강'];
// 그 학원의 다음 수업 날 (숙제 내는 날 기본값)
function nextClassDate(c, from){
  for (let i=1; i<=21; i++){ const d = addDays(from, i), s = ymd(d); if ((c.days||[]).includes(d.getDay()) && inSeason(c, s) && !classOff(c, s)) return s; }
  return ymd(addDays(from, 1));
}
const className = id => S.classes.find(c => c.id === id)?.name || '';
const S = { db:null, sample:null, offline:false, loaded:new Set(), kids:[], classes:[], payments:{}, events:[],
  tab:'home', weekKid:'all', payMonth:null, showPast:false, save:null, ai:null,
  user:null, uid:null, names:{}, readOnly:false, family:null, gridWho:'all', terms:[], gridSeason:null, pickups:{}, homeDay:0, hwrules:[], hwdone:{}, evAll:[], notices:[], me:'' };
try { S.me = localStorage.getItem('me') || ''; } catch {}

/* ---------- 날짜 ---------- */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const ymOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d||1); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const addMonths = (ym,n) => { const d = parse(ym+'-01'); d.setMonth(d.getMonth()+n); return ymOf(d); };
const dayDiff = (a,b) => Math.round((parse(ymd(a)) - parse(ymd(b))) / 864e5);
const TODAY = parse(ymd(new Date()));
const fmtMD = s => { const d = parse(s); return `${d.getMonth()+1}/${d.getDate()} (${DOW[d.getDay()]})`; };
const won = n => (Number(n)||0).toLocaleString('ko-KR') + '원';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
S.payMonth = ymOf(TODAY);

/* ---------- 데이터 헬퍼 ---------- */
const kidById = id => S.kids.find(k => k.id === id);
const kc = id => { const k = kidById(id); return k ? `var(--${k.color||'k1'})` : 'var(--muted)'; };
const kidName = id => kidById(id)?.name || '공통';
const activeClasses = () => S.classes.filter(c => c.active !== false);
function dueDate(c, ym){ const [y,m] = ym.split('-').map(Number); const last = new Date(y,m,0).getDate(); return new Date(y,m-1,Math.min(Number(c.payDay)||1,last)); }
const payId = (cid, ym) => `${cid}_${ym}`;
// 회당 단가 학원: 그 달 수업 요일 수 − 휴일(공통·그 아이) − 그 학원 휴강일
function sessionDates(c, ym){
  const [y,m] = ym.split('-').map(Number), last = new Date(y,m,0).getDate(), out = [];
  for (let d=1; d<=last; d++){
    const dt = new Date(y,m-1,d), s = ymd(dt);
    if (!(c.days||[]).includes(dt.getDay()) || !inSeason(c, s)) continue;
    const off = S.events.some(e => e.date===s && ((e.type==='휴일' && (!e.kidId || e.kidId===c.kidId)) || (e.type==='학원휴강' && e.classId===c.id)));
    if (!off) out.push(s);
  }
  return out;
}
function feeInfo(c, ym){
  const p = S.payments[payId(c.id,ym)];
  if (p?.paidAt && p.amount != null) return {amt:Number(p.amount), how:'납부 금액'};
  if (p?.override != null) return {amt:Number(p.override), how:'직접 조정'};
  if (c.feeType === 'session'){ const n = sessionDates(c,ym).length; return {amt:n*(Number(c.fee)||0), how:`예상 ${n}회 × ${won(c.fee)} · 청구 오면 금액 입력`, n, estimate:true}; }
  return {amt:Number(c.fee)||0, how:''};
}
function payLabel(c){
  if (!c.payType) return c.payMethod ? ' · '+esc(c.payMethod) : '';
  return ` · ${esc(c.payType)} ${c.payAuto?'자동':'직접'}${c.payFrom?' ('+esc(c.payFrom)+')':''}`;
}
const payKey = c => c.payType ? `${c.payType} · ${c.payFrom||'어느 '+(c.payType==='카드'?'카드':'계좌')+'인지 미입력'}` : (c.payMethod || '납부 방법 미입력');
const isPaid = (c, ym) => !!S.payments[payId(c.id,ym)]?.paidAt;
function payStatus(c, ym){
  if (isPaid(c,ym)) return {key:'paid', label:'납부 완료'};
  const d = dayDiff(dueDate(c,ym), TODAY);
  if (d < 0) return {key:'overdue', label: c.payAuto ? '출금일 지남 · 확인' : `${-d}일 지남`};
  if (d === 0) return {key:'overdue', label: c.payAuto ? '오늘 자동 출금' : '오늘 납부일'};
  if (d <= 5) return {key:'soon', label:`D-${d}`};
  return {key:'later', label:`D-${d}`};
}
function payItems(ym){
  // 학기/방학 구분 학원: 회당 단가면 그 달 해당 기간 수업이 있을 때, 월 고정이면 납부일이 해당 기간일 때만 청구
  return activeClasses().filter(c => (!c.since || c.since <= ym) && c.feeType !== 'none'
      && (!c.season || c.season === 'both' || (c.feeType === 'session' ? sessionDates(c, ym).length > 0 : inSeason(c, ymd(dueDate(c, ym))))))
    .map(c => ({c, ym, due:dueDate(c,ym), st:payStatus(c,ym)}))
    .sort((a,b) => a.due - b.due);
}
function upcomingPays(){ // 지난달·이번달·다음달 중 미납이면서 7일 이내/지난 것
  const cur = ymOf(TODAY), out = [];
  for (const ym of [addMonths(cur,-1), cur, addMonths(cur,1)])
    for (const it of payItems(ym)) if (it.st.key !== 'paid' && dayDiff(it.due, TODAY) <= 7) out.push(it);
  return out.sort((a,b) => a.due - b.due);
}
// 요일마다 시간이 다른 학원은 times 배열 [{d, start, end}]에 요일별 시간을 둔다
// 셔틀: shuttle·ridePlace·backPlace, 시간은 ride(탑승)·back(하차). 데리러 가는 사람은 pick [{d, who}]
const slot = (c, dow) => {
  const t = (Array.isArray(c.times) && c.times.find(x => x.d === dow)) || {};
  const pk = Array.isArray(c.pick) && c.pick.find(x => x.d === dow);
  return {start:t.start||c.start||'', end:t.end||c.end||'',
    ride: c.shuttle ? (t.ride||c.ride||'') : '', back: c.shuttle ? (t.back||c.back||'') : '', who: pk?.who || ''};
};
const DEFAULT_FAMILY = ['엄마','아빠','할머니'];
const WHO_EXTRA = ['혼자 귀가','다음 학원으로 이동','돌봄교실'];
const family = () => (S.family && S.family.length) ? S.family : DEFAULT_FAMILY;
const whoOptions = sel => `<option value="">미정</option>` + [...family(), ...WHO_EXTRA].map(w=>`<option ${w===sel?'selected':''}>${esc(w)}</option>`).join('')
  + (sel && ![...family(), ...WHO_EXTRA].includes(sel) ? `<option selected>${esc(sel)}</option>` : '');
const dismissOf = (k, dow) => (k.dismiss||[]).find(x => x.d === dow && x.time);
const offDay = (kidId, s) => S.events.some(e => e.date===s && e.type==='휴일' && (!e.kidId || e.kidId===kidId));
const classOff = (c, s) => offDay(c.kidId, s) || S.events.some(e => e.date===s && e.type==='학원휴강' && e.classId===c.id);
/* 방학: terms 컬렉션 {name, start, end, kidId('' = 모든 아이)}. 학원 season: 'both' | 'term'(학기 중만) | 'vac'(방학 중만) */
const termOf = (kidId, s) => S.terms.find(t => t.start && t.end && s >= t.start && s <= t.end && (!t.kidId || t.kidId === kidId));
const isVac = (kidId, s) => !!termOf(kidId, s);
const inSeason = (c, s) => c.season === 'term' ? !isVac(c.kidId, s) : c.season === 'vac' ? isVac(c.kidId, s) : true;
const SEASON_LABEL = {term:'학기 중만', vac:'방학 중만'};
const vacDismissOf = (k, dow) => (k.vacDismiss||[]).find(x => x.d === dow && x.time);
const dismissOn = (k, date) => isVac(k.id, ymd(date)) ? vacDismissOf(k, date.getDay()) : dismissOf(k, date.getDay());
// 날짜 기준: 그날 실제로 가는 학원 (학기/방학·휴일·휴강 반영)
const classesOnDate = (date, kid) => classesOn(date.getDay(), kid).filter(c => inSeason(c, ymd(date)) && !classOff(c, ymd(date)));
const nextTerm = () => S.terms.filter(t => t.end >= ymd(TODAY)).sort((a,b) => a.start.localeCompare(b.start))[0];
// 한 아이의 하루 동선: 하교 → 셔틀 탑승 → 수업 → 셔틀 하차, 시간순
// 그날만 바뀐 픽업 담당: pickups/{YYYY-MM-DD}_{dm-아이id | c-학원id} {date, key, who}
const whoOn = (s, key, base) => { const o = S.pickups[`${s}_${key}`]; return o ? {who:o.who||'', changed:true, base, key, date:s} : {who:base||'', changed:false, base:base||'', key, date:s}; };
function routeFor(k, date){
  const s = ymd(date), dow = date.getDay();
  if (offDay(k.id, s)) return {off:true, items:[]};
  const items = [];
  const vac = isVac(k.id, s), dm = dismissOn(k, date);
  if (dm) items.push({t:dm.time, kind:'dismiss', label: vac ? '돌봄·방과후 끝' : '하교', title:'하교', place: (vac ? k.vacPlace : k.dismissPlace) || '', ...whoOn(s, 'dm-'+k.id, dm.who), need:true, k});
  classesOnDate(date, k.id).forEach(c => {
    const x = slot(c, dow), w = whoOn(s, 'c-'+c.id, x.who);
    if (x.ride) items.push({t:x.ride, kind:'ride', label:'셔틀 탑승', title:c.name, place:c.ridePlace||'', k, c});
    items.push({t:x.start, end:x.end, kind:'class', label:'수업', title:c.name, memo:c.memo, ...(x.back ? {who:''} : w), need: !x.back, place:c.name, k, c, day:s});
    if (x.back) items.push({t:x.back, kind:'back', label:'셔틀 하차', title:c.name, place:c.backPlace||'', ...w, need:true, k, c});
  });
  return {off:false, items: items.sort((a,b) => a.t.localeCompare(b.t))};
}
// 데리러 가는 일: 가족별로 묶고, 담당이 비어 있으면 '담당 미정'
function pickupTasks(date){
  const fam = family(), groups = {};
  sortedKids().forEach(k => routeFor(k, date).items.forEach(it => {
    if (!it.need) return;
    if (it.who && !fam.includes(it.who)) return; // 혼자 귀가·다음 학원 등은 데리러 갈 일 없음
    const g = it.who || '담당 미정';
    (groups[g] ||= []).push({t: it.kind==='class' ? it.end : it.t, kid:k, what: it.kind==='dismiss' ? it.label : it.kind==='back' ? `${it.title} 셔틀 하차` : `${it.title} 끝`, place: it.place});
  }));
  Object.values(groups).forEach(a => a.sort((x,y) => x.t.localeCompare(y.t)));
  return groups;
}
const tm = s => { const [h,m] = String(s||'0:0').split(':').map(Number); return (h||0)*60 + (m||0); };
const hasEach = c => Array.isArray(c.times) && c.times.length > 0;
const classesOn = (dow, kid) => activeClasses().filter(c => (c.days||[]).includes(dow) && (!kid || kid==='all' || c.kidId===kid))
  .sort((a,b) => slot(a,dow).start.localeCompare(slot(b,dow).start));
const timeText = c => hasEach(c)
  ? WEEK_ORDER.filter(d=>(c.days||[]).includes(d)).map(d=>{const s=slot(c,d); return `${DOW[d]} ${s.start}–${s.end}`;}).join(', ')
  : `${WEEK_ORDER.filter(d=>(c.days||[]).includes(d)).map(d=>DOW[d]).join('·')} ${c.start||''}–${c.end||''}`;
const eventsOn = s => S.evAll.filter(e => e.date === s);
/* 매주 반복 숙제: hwrules {type, kidId, classId, title, note, mode:'class'(그 학원 수업 날마다)|'days', days:[d], start}
   했는지 여부는 hwdone/{규칙id}_{날짜} 문서로 남긴다. 화면에는 지난 7일~앞으로 3주만 펼쳐 보여 준다. */
function ruleDates(r, from, to){
  const out = [], c = r.classId ? S.classes.find(x => x.id === r.classId) : null;
  if (r.classId && (!c || c.active === false)) return out;
  for (let d = new Date(from); d <= to; d = addDays(d, 1)){
    const s = ymd(d);
    if (r.start && s < r.start) continue;
    if (r.mode === 'class' && c){ if ((c.days||[]).includes(d.getDay()) && inSeason(c, s) && !classOff(c, s)) out.push(s); }
    else if ((r.days||[]).includes(d.getDay()) && !offDay(r.kidId, s) && (!c || inSeason(c, s))) out.push(s);
  }
  return out;
}
function hwInstances(){
  const from = addDays(TODAY, -7), to = addDays(TODAY, 21);
  return S.hwrules.flatMap(r => ruleDates(r, from, to).map(s => {
    const dn = S.hwdone[`${r.id}_${s}`];
    return {id:`R_${r.id}_${s}`, rule:r.id, repeat:true, type:r.type||'학원숙제', kidId:r.kidId||'', classId:r.classId||'', title:r.title, note:r.note||'', date:s, done:!!dn, doneBy:dn?.by||''};
  }));
}
const sortedKids = () => [...S.kids].sort((a,b) => (a.order||0)-(b.order||0));
const who = id => !id ? '' : id === S.uid ? '나' : (S.names[id] || '가족');
async function resolveNames(){
  if (!S.user) return;
  const ids = [...new Set([...Object.values(S.payments).map(p=>p.paidBy), ...S.events.map(e=>e.doneBy)])].filter(id => id && id !== S.uid && !(id in S.names));
  if (!ids.length) return;
  try { const ps = await S.user.profiles(ids); ids.forEach(id => S.names[id] = ps?.[id]?.name || ''); render(); } catch {}
}

/* ---------- 렌더 ---------- */
function render(){
  S.evAll = S.loaded.size >= 10 ? [...S.events, ...hwInstances()] : S.events;
  const nNew = newNotices().length, dot = document.getElementById('noticeDot');
  dot.hidden = !nNew; dot.textContent = nNew || '';
  document.getElementById('todayLabel').textContent = `${TODAY.getFullYear()}년 ${TODAY.getMonth()+1}월 ${TODAY.getDate()}일 ${DOW[TODAY.getDay()]}요일`;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
  const gear = document.getElementById('gear'); if (S.tab === 'setup') gear.setAttribute('aria-current', 'page'); else gear.removeAttribute('aria-current');
  renderChips();
  const main = document.getElementById('main');
  if (S.offline){ main.innerHTML = `<div class="empty">이 화면에서는 저장소에 연결할 수 없습니다. claude.ai에 로그인한 상태로 이 알림장 링크를 열어 주세요.</div>`; return; }
  if (S.loaded.size < 10){ main.innerHTML = `<div class="empty">알림장을 불러오는 중입니다…</div>`; return; }
  main.innerHTML = (S.readOnly ? `<div class="notice" style="margin-bottom:16px">보기 전용으로 열려 있어요. 체크하거나 고치려면 알림장 주인에게 ‘편집자’로 초대해 달라고 해 주세요.</div>` : '')
    + ({home:viewHome, week:viewWeek, notice:viewNotices, grid:viewGrid, pay:viewPay, events:viewEvents, setup:viewSetup}[S.tab])();
}
/* ---------- 가족 공지: notices {text, from(가족 이름), by(계정 id), at, pinned, acks:{이름: 시각}} ---------- */
// 기간: start~end (둘 다 선택). 끝난 공지는 '지난 공지'로, 시작 전 공지는 '예정'으로 나눈다
const nStatus = n => { const t = ymd(TODAY); return n.end && n.end < t ? 'past' : n.start && n.start > t ? 'future' : 'active'; };
const periodText = n => {
  if (!n.start && !n.end) return '';
  const range = n.start && n.start === n.end ? fmtMD(n.start) : `${n.start ? fmtMD(n.start) : ''}~${n.end ? fmtMD(n.end) : ''}`, st = nStatus(n);
  const left = n.end && st === 'active' ? dayDiff(parse(n.end), TODAY) : null;
  const tag = st === 'past' ? '끝남' : st === 'future' ? `${dayDiff(parse(n.start), TODAY)}일 뒤 시작` : left === 0 ? '오늘까지' : left != null ? `${left}일 남음` : '진행 중';
  return `<span class="pill ${st==='past'?'later':st==='future'?'type':'soon'}">${range} · ${tag}</span>`;
};
// 최근 7일 안에 다른 가족이 올렸고, 내가 아직 '확인' 안 한 진행 중 공지

function viewWeek(){
  if (!S.classes.length) return `<div class="empty">아직 등록된 학원이 없습니다. <button class="btn small" data-act="newClass">학원 추가</button></div>`;
  const filter = kidFilter();
  const mon = addDays(TODAY, -((TODAY.getDay()+6)%7));
  const cols = WEEK_ORDER.map((dow,i) => {
    const date = addDays(mon,i);
    const cls = classesOn(dow, S.weekKid).filter(c => inSeason(c, ymd(date)));
    const ev = eventsOn(ymd(date)).filter(e => S.weekKid==='all' || e.kidId===S.weekKid || !e.kidId);
    const clash = new Set();
    // 같은 아이 시간이 겹치면 표시
    for (let a=0;a<cls.length;a++) for (let b=a+1;b<cls.length;b++){
      const x=cls[a], y=cls[b];
      const p = slot(x,dow), q = slot(y,dow);
      if (x.kidId===y.kidId && p.start < q.end && q.start < p.end){ clash.add(x.id); clash.add(y.id); }
    }
    return `<div class="day ${dayDiff(date,TODAY)===0?'is-today':''}"><h3><span>${DOW[dow]}</span><span class="num muted small">${date.getMonth()+1}/${date.getDate()}</span></h3>
      ${sortedKids().filter(k=>S.weekKid==='all'||k.id===S.weekKid).map(k=>{ const dm = dismissOn(k,date); return dm && !offDay(k.id, ymd(date)) ? `<div class="blk dm" style="--kc:${kc(k.id)}"><div class="t">${esc(dm.time)} ${isVac(k.id, ymd(date))?'돌봄·방과후 끝':'하교'}</div>${esc(k.name)}${(w => w.who?` · ${esc(w.who)}${w.changed?' (변경)':''}`:'')(whoOn(ymd(date), 'dm-'+k.id, dm.who))}</div>` : ''; }).join('')}
      ${cls.map(c=>{ const x = slot(c,dow), off = classOff(c, ymd(date)); return `<div class="blk ${clash.has(c.id)?'clash':''} ${off?'off':''}" style="--kc:${kc(c.kidId)}"><div class="t">${esc(x.start)}–${esc(x.end)}${off?' · 쉼':''}</div>${esc(c.name)}${S.weekKid==='all'?`<div class="t">${esc(kidName(c.kidId))}</div>`:''}${x.ride?`<div class="t">셔틀 ${esc(x.ride)} → ${esc(x.back||'?')}</div>`:''}${(w => w.who?`<div class="t who">${family().includes(w.who)?'데리러 ':''}${esc(w.who)}${w.changed?' (변경)':''}</div>`:'')(whoOn(ymd(date), 'c-'+c.id, x.who))}</div>`; }).join('')}
      ${ev.map(e=>`<div class="blk" style="--kc:var(--hl)"><div class="t">${esc(e.type)}</div>${esc(e.title)}</div>`).join('')}
      ${!cls.length&&!ev.length?'<div class="muted small">—</div>':''}</div>`;
  }).join('');
  const total = activeClasses().filter(c=>S.weekKid==='all'||c.kidId===S.weekKid).reduce((s,c)=>s+(c.days||[]).length,0);
  return `${filter}<div class="panel-h"><h2>이번 주</h2><span class="muted small">주 ${total}회 수업 · 점선 테두리는 같은 아이 시간이 겹치는 수업</span></div><div class="week-scroll"><div class="week">${cols}</div></div>`;
}
function kidFilter(){
  return `<div class="filter"><button aria-pressed="${S.weekKid==='all'}" data-act="weekKid" data-id="all">모두</button>${sortedKids().map(k=>`<button aria-pressed="${S.weekKid===k.id}" data-act="weekKid" data-id="${k.id}" style="--kc:var(--${k.color||'k1'})"><span class="dot"></span>${esc(k.name)}</button>`).join('')}</div>`;

/* 시간표 그림: 세로축이 시간, 요일 칸 안에서 아이마다 세로 줄을 나눠 수업을 블록으로 그린다 */
function viewGrid(){
  if (!S.classes.length) return `<div class="empty">아직 등록된 학원이 없습니다. <button class="btn small" data-act="newClass">학원 추가</button></div>`;
  const kids = sortedKids().filter(k => S.weekKid==='all' || k.id===S.weekKid);
  const season = S.gridSeason || 'term', vac = season === 'vac';
  const fits = c => !c.season || c.season === 'both' || c.season === season;
  const cls = activeClasses().filter(c => kids.some(k => k.id===c.kidId) && fits(c));
  const dismissOf = (k, d) => vac ? vacDismissOf(k, d) : (k.dismiss||[]).find(x => x.d === d && x.time);
  const classesOn = (d, kid) => cls.filter(c => c.kidId === kid && (c.days||[]).includes(d)).sort((a,b) => slot(a,d).start.localeCompare(slot(b,d).start));
  const days = WEEK_ORDER.filter(d => (d>=1 && d<=5) || cls.some(c => (c.days||[]).includes(d)));
  let lo = 24*60, hi = 0;
  const span = (a, b) => { if (a){ lo = Math.min(lo, tm(a)); hi = Math.max(hi, tm(b||a) + (b?0:30)); } };
  cls.forEach(c => (c.days||[]).forEach(d => { const s = slot(c,d); if (s.start && s.end){ span(s.ride||s.start, s.back||s.end); span(s.start, s.end); } }));
  kids.forEach(k => days.forEach(d => { const dm = dismissOf(k,d); if (dm) span(dm.time); }));
  if (!hi){ lo = 14*60; hi = 19*60; }
  lo = Math.floor(lo/60)*60; hi = Math.ceil(hi/60)*60; if (hi - lo < 180) hi = lo + 180;
  const PX = 64/60, H = Math.round((hi-lo)*PX), lanes = Math.max(1, kids.length);
  const hours = []; for (let t=lo; t<=hi; t+=60) hours.push(t);
  const axis = `<div class="gday gaxis"><div class="ghead">&nbsp;</div><div class="gcol" style="height:${H}px">${hours.map(t=>`<span style="top:${Math.round((t-lo)*PX)}px">${pad(t/60)}:00</span>`).join('')}</div></div>`;
  const cols = days.map(d => {
    const blocks = kids.map((k, li) => {
      const pos = (a, b, minH) => `top:${Math.round((tm(a)-lo)*PX)}px;height:${Math.max(minH, Math.round((tm(b)-tm(a))*PX) - 2)}px;left:calc(${li} * 100% / ${lanes} + 2px);width:calc(100% / ${lanes} - 4px)`;
      const dimFor = w => S.gridWho!=='all' && w !== S.gridWho ? 'dim' : '';
      const ks = classesOn(d, k.id);
      const dm = dismissOf(k, d);
      const dmHtml = dm ? `<div class="gmark ${dimFor(dm.who)}" style="--kc:${kc(k.id)};${pos(dm.time, dm.time, 30)}" title="${esc(k.name)} ${vac?'돌봄·방과후 끝':'하교'} ${esc(dm.time)} ${esc(dm.who||'')}"><span class="num">${esc(dm.time)}</span> ${vac?'돌봄 끝':'하교'}${dm.who?`<br><b>${esc(dm.who)}</b>`:''}</div>` : '';
      return dmHtml + ks.map(c => {
        const s = slot(c,d); if (!s.start || !s.end) return '';
        const clash = ks.some(o => { if (o===c) return false; const q = slot(o,d); return s.start < q.end && q.start < s.end; });
        const ride = s.ride && s.ride < s.start ? `<div class="gshut ${dimFor('')}" style="--kc:${kc(c.kidId)};${pos(s.ride, s.start, 14)}" title="셔틀 탑승 ${esc(s.ride)} ${esc(c.ridePlace||'')}"><span class="num">${esc(s.ride)}</span> 셔틀${c.ridePlace?' · '+esc(c.ridePlace):''}</div>` : '';
        const back = s.back && s.back > s.end ? `<div class="gshut ${dimFor(s.who)}" style="--kc:${kc(c.kidId)};${pos(s.end, s.back, 14)}" title="셔틀 하차 ${esc(s.back)} ${esc(c.backPlace||'')}"><span class="num">${esc(s.back)}</span> 하차${s.who?` · <b>${esc(s.who)}</b>`:''}</div>` : '';
        return ride + `<div class="gblk ${clash?'clash':''} ${dimFor(s.back?'':s.who)}" style="--kc:${kc(c.kidId)};${pos(s.start, s.end, 20)}" title="${esc(kidName(c.kidId))} ${esc(c.name)} ${esc(s.start)}–${esc(s.end)}"><b>${esc(c.name)}</b><span class="num">${esc(s.start)}–${esc(s.end)}</span>${!s.back && s.who ? `<span class="gwho">${esc(s.who)}</span>` : ''}</div>` + back;
      }).join('');
    }).join('');
    return `<div class="gday"><div class="ghead ${d===TODAY.getDay()?'is-today':''}">${DOW[d]}</div><div class="gcol" style="height:${H}px">${blocks}</div></div>`;
  }).join('');
  const legend = kids.map(k => {
    const ks = cls.filter(c => c.kidId===k.id);
    const n = ks.reduce((s,c)=>s+(c.days||[]).length,0);
    const mins = ks.reduce((s,c)=>s+(c.days||[]).reduce((t,d)=>{const x=slot(c,d); return t+Math.max(0,tm(x.end)-tm(x.start));},0),0);
    return `<span class="kidtag" style="--kc:var(--${k.color||'k1'})"><span class="dot"></span>${esc(k.name)} <span class="muted">주 ${n}회 · ${Math.floor(mins/60)}시간${mins%60?` ${mins%60}분`:''}</span></span>`;
  }).join('');
  const whoFilter = `<div class="filter"><span class="small muted" style="align-self:center">데리러 가는 사람</span><button aria-pressed="${S.gridWho==='all'}" data-act="gridWho" data-id="all">모두</button>${family().map(w=>`<button aria-pressed="${S.gridWho===w}" data-act="gridWho" data-id="${esc(w)}">${esc(w)}</button>`).join('')}</div>`;
  const nt = nextTerm();
  const seasonFilter = `<div class="filter seg"><button aria-pressed="${!vac}" data-act="gridSeason" data-id="term">학기 중</button><button aria-pressed="${vac}" data-act="gridSeason" data-id="vac">방학 중${nt?` · ${esc(nt.name)} ${fmtMD(nt.start)}~${fmtMD(nt.end)}`:''}</button></div>`;
  const vacNote = vac && !S.terms.length ? `<div class="notice" style="margin-bottom:10px">방학 기간이 아직 없어요. ‘아이·학원 관리’에서 방학 기간을 넣으면 그 기간에는 오늘 화면·알람도 방학 시간표로 바뀝니다.</div>` : '';
  return `${seasonFilter}${kidFilter()}${whoFilter}${vacNote}<div class="panel-h"><h2>${vac?'방학 중 시간표':'학기 중 시간표'}</h2><div class="chips">${legend}</div></div>
    <p class="muted small" style="margin:0 0 10px">${lanes>1?`요일 칸 안에서 왼쪽부터 ${kids.map(k=>esc(k.name)).join(', ')} 순서예요. `:''}옅은 칸은 셔틀 타고 오가는 시간, 점선 줄은 하교, 굵은 이름은 데리러 가는 사람이에요.${S.gridWho!=='all'?` 지금은 ${esc(S.gridWho)} 담당만 진하게 보여요.`:''}</p>
    <div class="gwrap"><div class="ggrid" style="grid-template-columns:44px repeat(${days.length}, minmax(${lanes>1?Math.min(240, 66*lanes):84}px, 1fr))">${axis}${cols}</div></div>`;
}

function viewPay(){
  const ym = S.payMonth;
  const items = payItems(ym);
  const amt = i => feeInfo(i.c, i.ym).amt;
  const total = items.reduce((s,i)=>s+amt(i),0);
  const paid = items.filter(i=>i.st.key==='paid').reduce((s,i)=>s+amt(i),0);
  const byKid = sortedKids().map(k => {
    const ks = items.filter(i=>i.c.kidId===k.id); const t = ks.reduce((s,i)=>s+amt(i),0);
    return ks.length ? `<div class="row"><span class="kidtag" style="--kc:var(--${k.color||'k1'})"><span class="dot"></span>${esc(k.name)}</span><div class="main muted small">${ks.length}곳</div><span class="amt">${won(t)}</span></div>` : '';
  }).join('');
  const groups = {};
  items.forEach(i => { const k = payKey(i.c); (groups[k] ||= {t:0, auto:0, n:0}); groups[k].t += amt(i); groups[k].n++; if (i.c.payAuto) groups[k].auto++; });
  const byMethod = Object.entries(groups).sort((a,b)=>b[1].t-a[1].t).map(([k,g]) => `<div class="row"><div class="main"><div class="title">${esc(k)}</div><div class="sub">${g.n}곳${g.auto?` · 자동 ${g.auto}곳`:''}</div></div><span class="amt">${won(g.t)}</span></div>`).join('');
  const [y,m] = ym.split('-');
  return `<div class="grid2">
    <section class="panel"><div class="panel-h"><div class="monthnav"><button class="btn ghost" data-act="month" data-n="-1" aria-label="이전 달">‹</button><h2>${y}년 ${Number(m)}월 학원비</h2><button class="btn ghost" data-act="month" data-n="1" aria-label="다음 달">›</button></div></div>
      ${items.length?`<div class="list">${items.map(it=>payRow(it)).join('')}</div>`:`<div class="empty">이 달에 낼 학원비가 없습니다.</div>`}</section>
    <div class="stack">
      <section class="panel"><div class="sum"><div><div class="lab">이달 합계</div><div class="val">${won(total)}</div></div><div><div class="lab">납부 완료</div><div class="val">${won(paid)}</div></div><div><div class="lab">남은 금액</div><div class="val">${won(total-paid)}</div></div></div>
        <div class="meter" role="img" aria-label="납부 진행률"><i style="width:${total?Math.round(paid/total*100):0}%"></i></div></section>
      <section class="panel"><div class="panel-h"><h3>결제수단별</h3><span class="muted small">카드값·통장 잔액 확인용</span></div><div class="list">${byMethod||'<div class="muted small">등록된 학원이 없습니다.</div>'}</div></section>
      <section class="panel"><div class="panel-h"><h3>아이별 학원비</h3></div><div class="list">${byKid||'<div class="muted small">등록된 학원이 없습니다.</div>'}</div></section>
      <p class="muted small">‘회당 단가’ 학원은 그 달 수업 요일 수에서 휴일과 ‘학원휴강’ 일정을 빼고 계산합니다. 학원 청구서와 금액이 다르면 금액을 눌러 그 달만 고칠 수 있어요. ‘납부’를 누르면 그때 금액으로 기록됩니다.</p>
    </div></div>`;
}

function viewEvents(){
  const tdy = ymd(TODAY), f = S.evFilter || 'all';
  const pass = e => f==='all' || (f==='hw' ? isHw(e) : f==='fam' ? isFam(e) : !isHw(e) && !isFam(e));
  const late = S.evAll.filter(e => isHw(e) && !e.repeat && !e.done && e.date < tdy && pass(e)).sort((a,b)=>a.date.localeCompare(b.date));
  // 반복 숙제는 앞으로 2주까지만 펼쳐서 목록이 길어지지 않게
  const up = S.evAll.filter(e => pass(e) && (S.showPast || e.date >= tdy) && (!e.repeat || dayDiff(parse(e.date), TODAY) <= 7)).sort((a,b)=>a.date.localeCompare(b.date));
  const groups = {};
  up.forEach(e => (groups[e.date] ||= []).push(e));
  const body = Object.keys(groups).map(d => `<div class="kidblock"><div class="kidname">${fmtMD(d)} <span class="muted small">${(()=>{const n=dayDiff(parse(d),TODAY);return n===0?'오늘':n===1?'내일':n>0?`${n}일 뒤`:`${-n}일 전`;})()}</span></div><div class="list">${groups[d].sort(evSort).map(e=>evRow(e)).join('')}</div></div>`).join('');
  const chip = (k, label) => `<button aria-pressed="${f===k}" data-act="evFilter" data-id="${k}">${label}</button>`;
  return `<section class="panel"><div class="panel-h"><h2>준비물·숙제</h2>
      <div class="btns"><button class="btn pri" data-act="newEv">추가</button><button class="btn" data-act="newHw">학원 숙제 추가</button><button class="btn" data-act="ai" ${S.sample?'':'hidden'}>가정통신문·숙제 안내로 한 번에 넣기</button></div></div>

      ${late.length && !S.showPast ? `<div class="kidblock"><div class="kidname warn-text">아직 안 한 숙제 <span class="muted small">${late.length}개 · 기한 지남</span></div><div class="list">${late.map(e=>evRow(e,{when:true})).join('')}</div></div>` : ''}
      ${S.hwrules.length && f !== 'school' ? `<p class="small muted" style="margin:0 0 8px">매주 반복 숙제는 앞으로 일주일 것만 보여요.</p>` : ''}
      ${body || `<div class="empty">다가오는 준비물·숙제가 없습니다. 학원 숙제는 ‘학원 숙제 추가’나 오늘 화면의 학원 옆 ‘숙제’ 버튼으로 넣을 수 있어요.</div>`}
      ${S.hwrules.length && f !== 'school' ? `<div class="kidblock"><div class="kidname">매주 반복 숙제 <span class="muted small">${S.hwrules.length}개</span></div><div class="list">${S.hwrules.map(r => {
        const c = S.classes.find(x => x.id === r.classId);
        const when = r.mode === 'class' && c ? `${esc(c.name)} 수업 날마다 (${WEEK_ORDER.filter(d=>(c.days||[]).includes(d)).map(d=>DOW[d]).join('·')})` : `매주 ${WEEK_ORDER.filter(d=>(r.days||[]).includes(d)).map(d=>DOW[d]).join('·')}`;
        return `<div class="row"><span class="bar" style="--kc:${kc(r.kidId)}"></span><div class="main"><div class="title">${c?`<span class="muted">${esc(c.name)} ·</span> `:''}${esc(r.title)}</div><div class="sub">${esc(kidName(r.kidId))} · ${when}${r.note?' · '+esc(r.note):''}</div></div><button class="btn ghost small" data-act="editRule" data-id="${r.id}">수정</button></div>`; }).join('')}</div></div>` : ''}
      <div style="margin-top:14px"><button class="btn ghost small" data-act="past">${S.showPast?'지난 일정 숨기기':'지난 일정도 보기'}</button></div></section>`;
}

// 예전 데이터 파일: {collections: {이름: [{id, data}, ...]}}
const IMPORT_COLS = ['kids','classes','payments','events','settings','terms','pickups','hwrules','hwdone','notices'];
async function importRun(btn){
  const f = document.getElementById('imp-file')?.files?.[0], st = document.getElementById('imp-st');
  if (!f){ st.textContent = '먼저 기존데이터.json 파일을 골라 주세요.'; return; }
  let json; try { json = JSON.parse(await f.text()); } catch { st.textContent = '파일을 읽지 못했어요. 기존데이터.json이 맞는지 확인해 주세요.'; return; }
  const writes = [];
  IMPORT_COLS.forEach(c => (json?.collections?.[c] || []).forEach(d => { if (d && d.id && d.data && typeof d.data === 'object') writes.push([c, String(d.id), d.data]); }));
  if (!writes.length){ st.textContent = '가져올 내용이 없어요.'; return; }
  if (!btn.classList.contains('armed')){ btn.classList.add('armed'); btn.textContent = `${writes.length}개 항목 가져오기 (한 번 더 누르기)`; return; }
  btn.disabled = true; st.textContent = '가져오는 중…';
  try {
    for (let i = 0; i < writes.length; i += 400){
      const batch = fs.batch();
      writes.slice(i, i + 400).forEach(([c, id, data]) => batch.set(fs.collection(c).doc(id), data));
      await batch.commit();
    }
    st.textContent = `${writes.length}개 항목을 가져왔어요.`; toast('예전 데이터를 가져왔어요.');
  } catch(e){ st.textContent = '가져오지 못했어요: ' + (e.code || e.message); }
  finally { btn.disabled = false; btn.classList.remove('armed'); btn.textContent = '가져오기'; }
}

// 학원 폼: 시간 방식과 고른 요일에 맞춰 입력칸을 보이거나 숨긴다
function syncTimes(){
  const mode = document.getElementById('c-timemode'); if (!mode) return;
  const each = mode.value === 'each';
  document.getElementById('c-same').hidden = each;
  document.getElementById('c-each').hidden = !each;
  let any = false;
  WEEK_ORDER.forEach(d => { const on = document.getElementById('c-d'+d).checked; any ||= on; document.getElementById('c-row'+d).hidden = !on; document.getElementById('c-wrow'+d).hidden = !on; });
  document.getElementById('c-each-empty').hidden = any;
  document.getElementById('c-w-empty').hidden = any;
  const sh = document.getElementById('c-shuttle').checked;
  document.querySelectorAll('#mBody .shut-only').forEach(el => el.hidden = !sh);
}
document.addEventListener('change', ev => { if (/^c-(d\d|timemode|shuttle)$/.test(ev.target.id)) syncTimes(); });
document.addEventListener('change', ev => {
  if (ev.target.id !== 'n-me') return;
  S.me = ev.target.value; try { localStorage.setItem('me', S.me); } catch {}
  const draft = val('n-text'), pin = document.getElementById('n-pin')?.checked;
  render();
  if (document.getElementById('n-text')){ document.getElementById('n-text').value = draft; document.getElementById('n-pin').checked = !!pin; }
});
// 그날만 픽업 담당 바꾸기: 원래 담당으로 되돌리면 변경 기록을 지운다
document.addEventListener('change', async ev => {
  const t = ev.target; if (!t.classList || !t.classList.contains('whosel')) return;
  const {date, key, base} = t.dataset, ref = S.db.doc('pickups/' + date + '_' + key);
  t.disabled = true;
  try {
    if (t.value === base) await ref.delete();
    else await ref.set({date, key, who:t.value, by:S.uid||'', at:new Date().toISOString()});
    toast(`${fmtMD(date)} 데리러 가는 사람: ${t.value || '미정'}. 가족 모두에게 보여요.`);
  } catch(e){ toast(errMsg(e)); render(); }
  finally { t.disabled = false; }
});

// 숙제일 때만 반복 선택을, 매주 반복일 때만 요일·방법을 보여 준다
function syncEv(){
  const type = document.getElementById('e-type'); if (!type) return;
  const hw = isHw({type:type.value}), rep = document.querySelector('[name=e-rep]:checked');
  const weekly = hw && rep?.value === 'weekly';
  document.querySelectorAll('#mBody .hw-only').forEach(el => el.hidden = !hw);
  document.querySelectorAll('#mBody .nonhw-only').forEach(el => el.hidden = hw);
  const cls = document.getElementById('e-class'); if (cls) cls.closest('label').hidden = !CLASS_TYPES.includes(type.value);
  document.querySelectorAll('#mBody .rep-only').forEach(el => el.hidden = !weekly);
  const hasClass = !!val('e-class') && type.value === '학원숙제';
  const mode = document.getElementById('e-mode');
  if (mode){ mode.closest('label').hidden = !hasClass; document.getElementById('e-days').hidden = hasClass && mode.value === 'class'; }
  document.getElementById('e-date-lab').textContent = weekly ? '언제부터' : '날짜 (숙제는 내는 날)';
}
document.addEventListener('change', ev => { if (/^e-(type|class|mode)$/.test(ev.target.id) || ev.target.name === 'e-rep') syncEv(); });

async function aiAdd(){
  const pick = (S.ai.items||[]).filter((_,i)=>document.getElementById('ai-i'+i)?.checked);
  for (const x of pick) await S.db.collection('events').add({...x, done:false});
  const vp = (S.ai.vacs||[]).filter((_,i)=>document.getElementById('ai-v'+i)?.checked);
  for (const v of vp){
    const same = S.terms.find(t => t.start === v.start && t.end === v.end && (t.kidId||'') === v.kidId);
    if (!same) await S.db.collection('terms').add(v);
  }
  closeModal(); toast(`일정 ${pick.length}건${vp.length?`, 방학 ${vp.length}건`:''}을 추가했어요.`);
}

      case 'homeDay': S.homeDay = Number(id); render(); break;
      case 'evFilter': S.evFilter = id; render(); break;
      case 'nAck': await S.db.doc('notices/'+id).update(new firebase.firestore.FieldPath('acks', S.me), new Date().toISOString()); toast('확인했다고 표시했어요.'); break;
      case 'logout': await auth.signOut(); break;
      case 'importRun': await importRun(b); break;
      case 'nPast': S.showPastN = !S.showPastN; render(); break;
      case 'nEdit': noticeForm(id); break;
      case 'nPin': { const n = S.notices.find(x=>x.id===id); await S.db.doc('notices/'+id).update({pinned:!n?.pinned}); break; }
      case 'hwAdd': { const c = S.classes.find(x=>x.id===id); if (c) eventForm(null, {type:'학원숙제', classId:c.id, kidId:c.kidId, date:nextClassDate(c, parse(b.dataset.day||ymd(TODAY)))}); break; }
      case 'newHw': { const c = activeClasses()[0]; eventForm(null, {type:'학원숙제', classId:c?.id||'', kidId:c?.kidId||'', date: c ? nextClassDate(c, TODAY) : ymd(addDays(TODAY,1))}); break; }
      case 'resetWho': await S.db.doc('pickups/'+id).delete(); toast('원래 담당으로 되돌렸어요.'); break;
      case 'gridSeason': S.gridSeason = id; render(); break;
      case 'newTerm': termForm(); break;
      case 'editTerm': termForm(id); break;
      case 'vacCopy': { const o = S.classes.find(x=>x.id===id); if (o) classForm(null, {...o, id:undefined, season:'vac', feeType:'none', name:o.name, _from:o.id}); break; }
      case 'past': S.showPast = !S.showPast; render(); break;
      case 'month': S.payMonth = addMonths(S.payMonth, Number(b.dataset.n)); render(); break;
      case 'toggleEv': if (id.startsWith('R_')) {
          const e = S.evAll.find(x => x.id === id), ref = S.db.doc('hwdone/' + e.rule + '_' + e.date);
          if (e.done) await ref.delete(); else await ref.set({rule:e.rule, date:e.date, by:S.uid||''});
          break;
        } else { const e = S.events.find(x=>x.id===id); await S.db.doc('events/'+id).update({done:!e?.done, doneBy:!e?.done ? (S.uid||'') : ''}); break; }
      case 'pay': { const c = S.classes.find(x=>x.id===id), ym = b.dataset.ym, p = S.payments[payId(id,ym)];
        await S.db.doc('payments/'+payId(id,ym)).set({classId:id, month:ym, amount:feeInfo(c,ym).amt, paidAt:ymd(new Date()), paidBy:S.uid||'', ...(p?.override!=null?{override:p.override}:{})});
        toast(`${c?.name||''} 납부 완료로 기록했어요. 가족 모두에게 보입니다.`); break; }
      case 'unpay': { const ref = S.db.doc('payments/'+payId(id,b.dataset.ym)), p = S.payments[payId(id,b.dataset.ym)];
        if (p?.override!=null) await ref.set({classId:id, month:b.dataset.ym, override:p.override}); else await ref.delete();
        toast('납부 기록을 취소했어요.'); break; }
      case 'adjust': adjustForm(id, b.dataset.ym); break;
      case 'billRead': billRead(id, b.dataset.ym); break;
      case 'copy': navigator.clipboard.writeText(b.dataset.text).then(() => toast('입금계좌를 복사했어요.'), () => toast(b.dataset.text)); break;
      case 'adjReset': { await S.db.doc('payments/'+payId(id,b.dataset.ym)).delete(); closeModal(); toast('자동 계산 금액으로 되돌렸어요.'); break; }
      case 'del': {
        if (!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent = '한 번 더 누르면 삭제'; return; }
        const kind = b.dataset.kind;
        if (kind==='kids' && S.classes.some(c=>c.kidId===id)){ toast('이 아이의 학원을 먼저 삭제해 주세요.'); return; }
        await S.db.doc(kind+'/'+id).delete(); closeModal(); toast('삭제했어요.'); break;
      }
    }
  } catch(e){ toast(errMsg(e)); }
});

/* ---------- 시작 ---------- */
try { const t = localStorage.getItem('tab'); if (t) S.tab = t; } catch {}
/* Firebase: 구글 로그인 + Firestore. 보안 규칙에 등록된 가족 이메일만 읽고 쓸 수 있다. */
const firebaseConfig = {
  apiKey: "AIzaSyBR6oK_j6h29kXUJBQ3UWxhcpzn-hoCzuA",
  authDomain: "sweet-home-8ccf2.firebaseapp.com",
  projectId: "sweet-home-8ccf2",
  storageBucket: "sweet-home-8ccf2.firebasestorage.app",
  messagingSenderId: "1072204291925",
  appId: "1:1072204291925:web:e3cbe309f4914c223c19dc"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), fs = firebase.firestore();
const gate = document.getElementById('gate');
function showGate(msg, isErr){
  gate.hidden = false; document.querySelector('.wrap').hidden = true;
  document.getElementById('gateMsg').textContent = msg || '';
  document.getElementById('gateMsg').className = isErr ? 'gate-err' : 'muted small';
  document.getElementById('gateOut').hidden = !auth.currentUser;
  document.getElementById('gateIn').hidden = !!auth.currentUser;
}
document.getElementById('gateIn').onclick = async () => {
  const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
  try { await auth.signInWithPopup(p); }
  catch(e){
    if (['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code)) await auth.signInWithRedirect(p);
    else if (e.code !== 'auth/popup-closed-by-user') showGate('로그인하지 못했어요. 다시 눌러 주세요. (' + e.code + ')', true);
  }
};
document.getElementById('gateOut').onclick = () => auth.signOut();
auth.getRedirectResult().catch(e => showGate('로그인하지 못했어요. (' + e.code + ')', true));

let unsubs = [];
auth.onAuthStateChanged(async user => {
  unsubs.forEach(u => u()); unsubs = []; S.loaded = new Set();
  if (!user){ showGate('가족으로 등록된 구글 계정으로 로그인해 주세요.'); return; }
  S.db = fs; S.uid = user.uid; S.authUser = user;
  // 등록 안 된 계정이면 보안 규칙이 막아서 여기서 실패한다
  try { await fs.doc('members/' + user.uid).set({name:user.displayName||'', email:user.email||'', at:new Date().toISOString()}, {merge:true}); }
  catch(e){ showGate(`${user.email} 계정은 가족으로 등록되어 있지 않아요. 등록된 계정으로 다시 로그인해 주세요.`, true); return; }
  gate.hidden = true; document.querySelector('.wrap').hidden = false;
  render();
  const sub = (name, fn) => unsubs.push(fs.collection(name).onSnapshot(s => { fn(s.docs.map(d => ({id:d.id, ...d.data()}))); S.loaded.add(name); render(); }, () => toast('일부 내용을 불러오지 못했어요. 새로고침해 주세요.')));
  unsubs.push(fs.collection('members').onSnapshot(s => { s.docs.forEach(d => S.names[d.id] = d.data().name || ''); render(); }, () => {}));
  sub('kids', a => S.kids = a);
  sub('classes', a => S.classes = a);
  sub('payments', a => S.payments = Object.fromEntries(a.map(p => [p.id, p])));
  sub('events', a => S.events = a);
  sub('settings', a => S.family = a.find(x => x.id==='family')?.caregivers || null);
  sub('pickups', a => S.pickups = Object.fromEntries(a.map(p => [p.id, p])));
  sub('hwrules', a => S.hwrules = a);
  sub('notices', a => S.notices = a);
  sub('hwdone', a => S.hwdone = Object.fromEntries(a.map(p => [p.id, p])));
  sub('terms', a => { S.terms = a; if (S.gridSeason == null) S.gridSeason = S.kids.some(k => isVac(k.id, ymd(TODAY))) || a.some(t => !t.kidId && ymd(TODAY) >= t.start && ymd(TODAY) <= t.end) ? 'vac' : 'term'; });
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
